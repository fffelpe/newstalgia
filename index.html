
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Newstalgia - Acervo digital da memória do jornalismo televisivo brasileiro. As notícias passam. A história permanece.">

  <meta name="theme-color" content="#061477">

  <title>Newstalgia - A história permanece</title>

  <style>

    /* ========================================
       NEWSTALGIA
       Identidade visual: Internet 1990/2000
       ======================================== */

    :root {
      --azul-escuro: #061477;
      --azul-principal: #1635a3;
      --azul-claro: #718cda;
      --prata: #e1e3e9;
      --cinza-borda: #777f94;
      --vermelho: #ed2534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f8fb;
      color: #172340;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      font-size: 15px;
    }

    /* ========================================
       ESTRUTURA PRINCIPAL
       ======================================== */

    .pagina {
      width: min(100%, 1540px);
      min-height: 100vh;
      margin: auto;
      padding: 4px;
      background: #f6f8fc;

      border-left: 1px solid #c4c9d3;
      border-right: 1px solid #c4c9d3;
    }

    /* ========================================
       BANNER SUPERIOR
       ======================================== */

    .banner {
      position: relative;
      isolation: isolate;

      display: grid;
      grid-template-columns:
        136px minmax(360px, 1fr) 112px 302px;

      align-items: center;
      gap: 12px;

      min-height: 160px;
      padding: 9px 15px 10px 13px;

      overflow: hidden;

      border: 2px ridge #8ca0d9;

      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0 2px,
          rgba(255,255,255,.035) 2px 3px
        ),
        linear-gradient(
          105deg,
          #030a54 0%,
          #102a9a 46%,
          #0b1d7d 74%,
          #091459 100%
        );

      box-shadow:
        inset 0 2px 3px rgba(255,255,255,.32),
        inset 0 -6px 8px rgba(0,0,0,.2);
    }

    .banner::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;

      background:
        radial-gradient(
          ellipse at 25% 20%,
          rgba(109,149,244,.43),
          transparent 44%
        );

      pointer-events: none;
    }

    /* ========================================
       SILHUETA URBANA
       ======================================== */

    .silhueta {
      position: absolute;
      z-index: -1;

      bottom: 0;
      left: 0;

      width: 100%;
      height: 66px;

      opacity: .64;
      fill: #061052;

      pointer-events: none;
    }

    /* ========================================
       TELEVISÃO ANTIGA
       ======================================== */

    .tv-antiga {
      width: 132px;
      max-width: 100%;
      height: auto;

      align-self: end;

      filter:
        drop-shadow(
          8px 7px 5px rgba(0,0,0,.55)
        );
    }

    /* ========================================
       LOGOTIPO
       ======================================== */

    .marca {
      position: relative;
      min-width: 0;
      padding: 5px 0;
    }

    .marca::before,
    .marca::after {
      content: "";

      position: absolute;
      z-index: -1;

      pointer-events: none;

      border-radius: 50%;
      transform: rotate(-8deg);
    }

    /* Arco vermelho superior */

    .marca::before {
      width: min(70%, 420px);
      height: 48px;

      top: -8px;
      left: 29%;

      border-top: 8px solid #f42533;
    }

    /* Arco vermelho inferior */

    .marca::after {
      width: min(57%, 350px);
      height: 43px;

      left: 4%;
      bottom: 7px;

      border-bottom: 7px solid #ed1e2d;
    }

    .logotipo {
      display: block;

      margin: 0;

      font-family:
        Impact,
        "Arial Black",
        Arial,
        sans-serif;

      font-style: italic;
      font-weight: 900;

      font-size: clamp(45px, 5vw, 79px);
      line-height: 1.05;

      letter-spacing: -1.7px;
      text-transform: uppercase;
      white-space: nowrap;

      transform: skew(-6deg);

      color: #f4f7ff;

      background: linear-gradient(
        180deg,
        #ffffff 1%,
        #edf3ff 33%,
        #a6b8e0 58%,
        #f6f8ff 78%,
        #a1a9bd 100%
      );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;

      -webkit-text-stroke:
        1px rgba(6,20,80,.7);

      filter:
        drop-shadow(2px 3px 0 #020b44)
        drop-shadow(
          3px 4px 1px rgba(0,0,0,.5)
        );
    }

    /* ========================================
       SLOGAN
       ======================================== */

    .slogan {
      margin: 3px 0 0 19px;

      color: #f7f9ff;

      font-family:
        Tahoma,
        Verdana,
        sans-serif;

      font-size: clamp(14px, 1.45vw, 22px);
      font-style: italic;
      font-weight: 700;

      line-height: 1.3;

      text-shadow:
        2px 2px 2px #00083c;

      letter-spacing: .1px;
      white-space: nowrap;
    }

    /* ========================================
       ANTENA PARABÓLICA
       ======================================== */

    .parabolica {
      width: 113px;
      height: auto;

      opacity: .9;

      filter:
        drop-shadow(
          3px 5px 2px rgba(0,0,0,.35)
        );
    }

    /* ========================================
       CAIXA DE PESQUISA
       ======================================== */

    .pesquisa {
      position: relative;
      z-index: 1;

      width: 100%;

      align-self: center;

      margin: 0;
      color: white;
    }

    .pesquisa label {
      display: block;

      margin: 0 0 6px;

      font-size: 15px;
      font-weight: bold;

      text-shadow:
        1px 1px 1px #000a42;
    }

    .pesquisa-linha {
      display: flex;
      gap: 7px;
    }

    .pesquisa input {
      width: 100%;
      min-width: 0;

      height: 29px;
      padding: 3px 7px;

      border: 2px inset #b5bdcf;
      border-radius: 0;

      background: white;
      color: #152044;

      font-family:
        Tahoma,
        Verdana,
        sans-serif;

      font-size: 15px;

      box-shadow:
        inset 1px 1px 1px #777;

      appearance: none;
    }

    .pesquisa button {
      min-width: 47px;
      height: 29px;

      padding: 1px 8px;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;

      color: #0e1731;

      border: 2px outset #f8faff;
      border-radius: 0;

      background: linear-gradient(
        to bottom,
        #fcfcfd,
        #d2d6e1 67%,
        #b8bfcd
      );

      box-shadow:
        1px 1px 0 #596077;
    }

    .pesquisa button:hover {
      background: #e2eaff;
    }

    .pesquisa button:active {
      border-style: inset;
    }

    /* ========================================
       BARRA DE NAVEGAÇÃO
       ======================================== */

    .navegacao {
      display: grid;

      grid-template-columns:
        .85fr 1.05fr .9fr 1fr 1.35fr .8fr;

      gap: 5px;

      padding: 6px 10px;

      border: 1px solid #8a91a0;
      border-top-color: #eef0f5;

      background: linear-gradient(
        #e9eaf0,
        #c2c7d1 90%,
        #a5aaba
      );

      box-shadow:
        inset 0 1px white,
        0 2px 3px #cbd0da;
    }

    /* ========================================
       BOTÕES DO MENU
       ======================================== */

    .link-menu {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 9px;

      min-width: 0;
      min-height: 40px;

      padding: 6px 8px;

      text-decoration: none;

      font-family:
        Tahoma,
        Verdana,
        sans-serif;

      font-size: clamp(13px, 1.2vw, 18px);
      font-weight: bold;

      white-space: nowrap;

      color: #0e1731;

      cursor: pointer;

      border: 2px outset #f8faff;
      border-radius: 0;

      background: linear-gradient(
        to bottom,
        #fcfcfd,
        #d2d6e1 67%,
        #b8bfcd
      );

      text-shadow:
        1px 1px #fff;

      box-shadow:
        1px 1px 0 #596077;

      transition:
        background .15s ease;
    }

    .link-menu:hover:not(.ativo) {
      background: linear-gradient(
        #ffffff,
        #dce4ff 65%,
        #b3c0e9
      );
    }

    .link-menu:active {
      border-style: inset;
    }

    /* Botão selecionado */

    .link-menu.ativo {
      border: 2px inset #849bd6;

      background: linear-gradient(
        #284cc4,
        #071c91 65%,
        #03075f
      );

      color: white;

      text-shadow:
        1px 1px #02083d;

      box-shadow:
        inset 0 0 0 1px #687ed5;
    }

    /* Ícones */

    .icone {
      width: 21px;
      height: 21px;

      flex: 0 0 21px;

      stroke: #07185d;
      stroke-width: 1.6;

      fill: #f7f8ff;

      filter:
        drop-shadow(
          1px 1px 0 rgba(0,0,0,.3)
        );
    }

    /* Acessibilidade */

    .link-menu:focus-visible,
    .pesquisa button:focus-visible,
    .pesquisa input:focus-visible {
      outline: 3px solid #f7c442;
      outline-offset: 2px;
    }

    /* ========================================
       ÁREA PRINCIPAL
       ======================================== */

    .area-principal {
      min-height: calc(100vh - 227px);

      padding: 18px;

      background:
        repeating-linear-gradient(
          90deg,
          rgba(9,31,109,.006) 0 1px,
          transparent 1px 4px
        ),
        linear-gradient(
          #f7f9ff,
          #f9faff
        );
    }

    /* Mensagens provisórias */

    .aviso {
      width: fit-content;
      max-width: 100%;

      padding: 12px 16px;

      border: 1px solid #9ba9c7;

      background: #eef2ff;
      color: #162765;

      font-size: 14px;

      box-shadow:
        2px 2px 0 #d1d7e4;
    }

    [hidden] {
      display: none !important;
    }

    /* ========================================
       RESPONSIVIDADE
       ======================================== */

    @media (max-width: 1130px) {

      .banner {
        grid-template-columns:
          110px minmax(315px, 1fr) 72px 248px;

        gap: 8px;
      }

      .tv-antiga {
        width: 108px;
      }

      .parabolica {
        width: 76px;
      }

      .logotipo {
        font-size: clamp(42px, 5.25vw, 66px);
      }

      .slogan {
        font-size: clamp(12px, 1.5vw, 18px);
        margin-left: 8px;
      }

    }

    /* Tablets */

    @media (max-width: 850px) {

      .banner {
        grid-template-columns:
          100px minmax(0, 1fr) 240px;

        padding: 12px 10px;
        min-height: 136px;
      }

      .parabolica {
        display: none;
      }

      .logotipo {
        font-size: clamp(37px, 5.5vw, 55px);
      }

      .slogan {
        font-size: clamp(11px, 1.8vw, 15px);
        white-space: normal;
      }

      .navegacao {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .link-menu {
        font-size: 15px;
      }

    }

    /* Celulares */

    @media (max-width: 680px) {

      .banner {
        grid-template-columns:
          75px minmax(0, 1fr);

        gap: 5px 9px;
      }

      .tv-antiga {
        width: 75px;
        align-self: center;
      }

      .logotipo {
        font-size: clamp(30px, 8vw, 56px);
        letter-spacing: -.8px;
      }

      .slogan {
        font-size: clamp(12px, 2.9vw, 17px);
        line-height: 1.25;
        margin-left: 1px;
      }

      .pesquisa {
        grid-column: 1 / -1;
        width: 100%;
        margin-top: 5px;
      }

      .pesquisa label {
        margin-bottom: 3px;
      }

      .navegacao {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 5px;
        padding: 6px;
      }

      .link-menu {
        min-height: 40px;
        font-size: 14px;
        gap: 6px;
      }

      .area-principal {
        min-height: 65vh;
      }

    }

    @media (max-width: 360px) {

      .logotipo {
        font-size: 28px;
      }

      .icone {
        width: 18px;
        height: 18px;
        flex-basis: 18px;
      }

      .link-menu {
        padding: 5px 3px;
        font-size: 12px;
      }

    }

  </style>

</head>

<body>

  <!-- ========================================
       ÍCONES DOS BOTÕES
       ======================================== -->

  <svg
    xmlns="http://www.w3.org/2000/svg"
    style="position:absolute;width:0;height:0;overflow:hidden"
    aria-hidden="true"
  >

    <!-- Início -->

    <symbol id="i-inicio" viewBox="0 0 24 24">
      <path
        d="M2 11.4 12 3l10 8.4-2 2.2-2-1.7V21h-5v-7h-3v7H5v-9.1l-1 1z"
        fill="#f6e4a1"
      />
      <path
        d="M3 11.7 12 4l9 7.7M6 12v8h5v-6h3v6h4v-8"
        fill="none"
      />
    </symbol>

    <!-- Programas -->

    <symbol id="i-programas" viewBox="0 0 24 24">
      <rect
        x="2" y="5"
        width="20" height="16"
        rx="3"
        fill="#d7e0ec"
      />
      <rect
        x="5" y="8"
        width="14" height="10"
        rx="1"
        fill="#65a9d5"
      />
      <path
        d="m7 1 5 4 5-4M9 23h6"
        fill="none"
      />
    </symbol>

    <!-- Acervo -->

    <symbol id="i-acervo" viewBox="0 0 24 24">
      <rect
        x="2" y="3"
        width="20" height="18"
        fill="#e5e6f0"
      />
      <path
        d="M6 3v18M18 3v18M2 8h4m-4 5h4m-4 5h4m12-10h4m-4 5h4m-4 5h4"
        fill="none"
      />
      <rect
        x="8" y="6"
        width="8" height="12"
        fill="#72aedc"
        stroke="none"
      />
    </symbol>

    <!-- Emissoras -->

    <symbol id="i-emissoras" viewBox="0 0 24 24">
      <path
        d="M12 6 5 21h14z"
        fill="#b0b6c9"
      />
      <path
        d="M12 6v15M9 13h6M7 18h10M12 3v1"
        fill="none"
      />
      <path
        d="M8 2a6 6 0 0 0 0 8M16 2a6 6 0 0 1 0 8M5 1a10 10 0 0 0 0 12M19 1a10 10 0 0 1 0 12"
        fill="none"
        stroke-width="1.2"
      />
    </symbol>

    <!-- Linha do tempo -->

    <symbol id="i-tempo" viewBox="0 0 24 24">
      <rect
        x="2" y="4"
        width="20" height="18"
        rx="1"
        fill="#e7eaf5"
      />
      <rect
        x="2" y="6"
        width="20" height="5"
        fill="#bb1f34"
        stroke="none"
      />
      <path
        d="M7 2v6M17 2v6M2 11h20M7 14v3m5-3v3m5-3v3M7 19h3"
        fill="none"
      />
    </symbol>

    <!-- Sobre -->

    <symbol id="i-sobre" viewBox="0 0 24 24">
      <circle
        cx="12" cy="12"
        r="10"
        fill="#78aef5"
      />
      <path
        d="M12 10v8M10 10h4M10 18h4"
        stroke="#fff"
        stroke-width="2.2"
        fill="none"
      />
      <circle
        cx="12" cy="6.6"
        r="1.4"
        fill="#fff"
        stroke="none"
      />
    </symbol>

  </svg>

  <!-- ========================================
       PÁGINA
       ======================================== -->

  <div class="pagina">

    <!-- ======================================
         BANNER NEWSTALGIA
         ====================================== -->

    <header class="banner">

      <!-- Silhueta da cidade -->

      <svg
        class="silhueta"
        viewBox="0 0 1440 80"
        preserveAspectRatio="none"
        aria-hidden="true"
      >

        <path d="
          M0 80V38h18V24h11v21h17V31h9v18h30V30h12v22h21V15h11v35h15V33h14v17h25V26h11v24h23V41h14v12h22V27h12v25h22V35h8v18h26V18h14v35h20V40h12v13h28V24h8v28h24V37h16v17h23V13h13v41h26V30h11v21h28V39h17v17h23V18h13v37h27V42h14v14h25V28h17v27h22V37h15v17h29V18h11v38h21V39h15v16h31V30h16v25h26V42h11v14h27V33h18v23h28V21h12v35h32V37h16v20h30V27h11v30h31V44h20v13h25V17h13v39h30V39h15v18h29V26h12v29h26V46h15v11h24V33h15v24h24V20h13v37h28V40h18v17h24V30h17v25h21V43h18v14h27V22h13v37h21V42h11v17h25V29h14v30h24V43h13v16h25V27h12v32h24V46h15v14h20V39h17v41Z
        "/>

        <path
          d="M0 72h1440"
          fill="none"
          stroke="#020840"
          stroke-width="3"
        />

      </svg>

      <!-- Televisão antiga -->

      <svg
        class="tv-antiga"
        viewBox="0 0 150 142"
        role="img"
        aria-label="Televisor antigo"
      >

        <defs>

          <linearGradient
            id="cor-tv"
            x1="0" y1="0"
            x2="1" y2="1"
          >
            <stop stop-color="#141c45"/>
            <stop offset=".42" stop-color="#626c8e"/>
            <stop offset="1" stop-color="#111730"/>
          </linearGradient>

          <radialGradient id="cor-tela">
            <stop stop-color="#c2d9f5"/>
            <stop offset=".7" stop-color="#809bcc"/>
            <stop offset="1" stop-color="#344d81"/>
          </radialGradient>

          <pattern
            id="linhas-tela"
            width="4"
            height="4"
            patternUnits="userSpaceOnUse"
          >
            <path
              d="M0 1h4"
              stroke="#fff"
              stroke-opacity=".17"
              stroke-width="1"
            />
          </pattern>

        </defs>

        <!-- Gabinete do televisor -->

        <path
          d="M22 8 130 14q13 2 12 17l-6 92q-2 12-15 12L13 124Q4 123 5 110L8 29Q9 11 22 8Z"
          fill="#0b0f27"
          stroke="#9da6c6"
          stroke-width="3"
        />

        <path
          d="M24 15 125 20q10 0 9 12l-5 77q-1 12-11 12L19 116Q11 115 12 105l4-77q1-11 8-13Z"
          fill="url(#cor-tv)"
          stroke="#0c153c"
          stroke-width="3"
        />

        <!-- Tela -->

        <path
          d="M30 24 117 28q6 1 5 8l-4 67q0 6-7 6L25 104q-6 0-6-7l3-64q0-9 8-9Z"
          fill="url(#cor-tela)"
          stroke="#d6e7ff"
          stroke-width="3"
        />

        <!-- Imagem urbana no televisor -->

        <path
          d="M27 99V76l12-7v13l9-6v-8l10-6v31h7V56l9-5v41h7V72l9-6v27h9V79l12 6v19Z"
          fill="#405b94"
          opacity=".73"
        />

        <!-- Reflexos -->

        <path
          d="M19 33q50-18 103 0"
          fill="none"
          stroke="#fff"
          stroke-opacity=".28"
          stroke-width="4"
        />

        <path
          d="M24 28h99v81H24Z"
          fill="url(#linhas-tela)"
          opacity=".7"
        />

        <!-- Base e controles -->

        <path
          d="M24 120h100l-3 9H21Z"
          fill="#0b1131"
        />

        <circle
          cx="115" cy="125"
          r="2.3"
          fill="#e3ecff"
        />

        <path
          d="M39 137h72"
          stroke="#11182f"
          stroke-width="5"
          stroke-linecap="round"
        />

      </svg>

      <!-- ====================================
           LOGOTIPO E SLOGAN
           ==================================== -->

      <div class="marca">

        <h1 class="logotipo">
          Newstalgia
        </h1>

        <p class="slogan">
          As notícias passam. A história permanece.
        </p>

      </div>

      <!-- ====================================
           ANTENA PARABÓLICA
           ==================================== -->

      <svg
        class="parabolica"
        viewBox="0 0 125 136"
        aria-hidden="true"
      >

        <defs>
          <linearGradient
            id="prata-antena"
            x1="0" y1="0"
            x2="1" y2="1"
          >
            <stop stop-color="#e0e9ff"/>
            <stop offset=".5" stop-color="#95a9d0"/>
            <stop offset="1" stop-color="#536caa"/>
          </linearGradient>
        </defs>

        <!-- Prato da antena -->

        <path
          d="M17 54q38-52 93-48Q116 62 51 80Z"
          fill="url(#prata-antena)"
          stroke="#354b81"
          stroke-width="2.5"
        />

        <!-- Linhas estruturais -->

        <path
          d="M17 54 110 6M51 80 110 6M17 54l84-35M41 67l68-49"
          fill="none"
          stroke="#627aa9"
          stroke-width="1.6"
        />

        <!-- Reflexos -->

        <path
          d="M24 52 35 43M39 36l13 11M58 21l17 18M80 12l15 17M105 10l4 9"
          fill="none"
          stroke="#edf1fa"
          stroke-width="2"
          opacity=".65"
        />

        <!-- Suporte -->

        <path
          d="M52 79 66 91M62 89 75 122M67 91 51 122M53 122h26M65 90l25-60"
          fill="none"
          stroke="#8ea5d6"
          stroke-width="5"
        />

        <path
          d="M89 30 95 29"
          stroke="#fff"
          stroke-width="4"
        />

      </svg>

      <!-- ====================================
           PESQUISA DO SITE
           ==================================== -->

      <form
        class="pesquisa"
        id="form-pesquisa"
        role="search"
      >

        <label for="termo-pesquisa">
          Buscar no site:
        </label>

        <div class="pesquisa-linha">

          <input
            id="termo-pesquisa"
            name="q"
            type="search"
            autocomplete="off"
            aria-label="Buscar no acervo"
          >

          <button type="submit">
            OK
          </button>

        </div>

      </form>

    </header>

    <!-- ======================================
         BARRA DE NAVEGAÇÃO
         ====================================== -->

    <nav
      class="navegacao"
      aria-label="Navegação principal"
    >

      <!-- Início -->

      <a
        class="link-menu ativo"
        href="#inicio"
        data-secao="Início"
        aria-current="page"
      >

        <svg class="icone" aria-hidden="true">
          <use href="#i-inicio"/>
        </svg>

        <span>Início</span>

      </a>

      <!-- Programas -->

      <a
        class="link-menu"
        href="#programas"
        data-secao="Programas"
      >

        <svg class="icone" aria-hidden="true">
          <use href="#i-programas"/>
        </svg>

        <span>Programas</span>

      </a>

      <!-- Acervo -->

      <a
        class="link-menu"
        href="#acervo"
        data-secao="Acervo"
      >

        <svg class="icone" aria-hidden="true">
          <use href="#i-acervo"/>
        </svg>

        <span>Acervo</span>

      </a>

      <!-- Emissoras -->

      <a
        class="link-menu"
        href="#emissoras"
        data-secao="Emissoras"
      >

        <svg class="icone" aria-hidden="true">
          <use href="#i-emissoras"/>
        </svg>

        <span>Emissoras</span>

      </a>

      <!-- Linhas do tempo -->

      <a
        class="link-menu"
        href="#linhas-do-tempo"
        data-secao="Linhas do Tempo"
      >

        <svg class="icone" aria-hidden="true">
          <use href="#i-tempo"/>
        </svg>

        <span>Linhas do Tempo</span>

      </a>

      <!-- Sobre -->

      <a
        class="link-menu"
        href="#sobre"
        data-secao="Sobre"
      >

        <svg class="icone" aria-hidden="true">
          <use href="#i-sobre"/>
        </svg>

        <span>Sobre</span>

      </a>

    </nav>

    <!-- ======================================
         ÁREA DE CONTEÚDO
         ====================================== -->

    <main
      class="area-principal"
      id="inicio"
    >

      <!--
        Esta área ficará vazia inicialmente.

        Futuramente receberá:
        - Acervo de vídeos
        - Resultados de pesquisa
        - Listagem de programas
        - Emissoras
        - Linhas do tempo

        Programas iniciais:
        Cidade Alerta
        Brasil Urgente
        Repórter Cidadão
      -->

      <p
        id="aviso"
        class="aviso"
        role="status"
        aria-live="polite"
        hidden
      ></p>

    </main>

  </div>

  <!-- ========================================
       JAVASCRIPT
       ======================================== -->

  <script>

    (() => {

      const aviso =
        document.getElementById("aviso");

      const links =
        [...document.querySelectorAll(".link-menu")];

      const formulario =
        document.getElementById("form-pesquisa");

      const campo =
        document.getElementById("termo-pesquisa");


      /* ======================================
         CONTROLE DO MENU
         ====================================== */

      function atualizarSecao() {

        const hash =
          window.location.hash || "#inicio";

        const atual =
          links.find(link =>
            link.getAttribute("href") === hash
          ) || links[0];

        links.forEach(link => {

          const selecionado =
            link === atual;

          link.classList.toggle(
            "ativo",
            selecionado
          );

          if (selecionado) {

            link.setAttribute(
              "aria-current",
              "page"
            );

          } else {

            link.removeAttribute(
              "aria-current"
            );

          }

        });

        if (
          atual.getAttribute("href") === "#inicio"
        ) {

          aviso.hidden = true;
          aviso.textContent = "";

        } else {

          aviso.textContent =
            "A seção " +
            atual.dataset.secao +
            " está em preparação.";

          aviso.hidden = false;

        }

      }


      /* ======================================
         PESQUISA PROVISÓRIA
         ====================================== */

      formulario.addEventListener(
        "submit",
        evento => {

          evento.preventDefault();

          const termo =
            campo.value.trim();

          if (!termo) {

            campo.focus();
            return;

          }

          aviso.textContent =
            "A pesquisa por “" +
            termo +
            "” estará disponível quando os primeiros vídeos forem cadastrados.";

          aviso.hidden = false;

        }
      );


      /* ======================================
         EVENTOS DA NAVEGAÇÃO
         ====================================== */

      window.addEventListener(
        "hashchange",
        atualizarSecao
      );

      atualizarSecao();

    })();

  </script>

</body>

</html>
