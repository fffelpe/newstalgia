
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Newstalgia - Acervo digital da memória do jornalismo televisivo brasileiro. Cidade Alerta, Brasil Urgente e Repórter Cidadão.">

<meta name="theme-color" content="#061477">

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<title>Newstalgia - A história permanece</title>

<style>

:root {
    --azul-escuro: #061477;
    --azul-principal: #1635a3;
    --azul-claro: #718cda;
    --prata: #e1e3e9;
    --vermelho: #ed2534;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #f7f8fb;
    color: #172340;
    font-family: Tahoma, Verdana, Arial, sans-serif;
    font-size: 15px;
}

.pagina {
    width: min(100%, 1540px);
    min-height: 100vh;
    margin: auto;
    padding: 4px;
    background: #f6f8fc;
    border-left: 1px solid #c4c9d3;
    border-right: 1px solid #c4c9d3;
}

/* BANNER */

.banner {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-columns:
        136px minmax(360px, 1fr) 112px 302px;

    align-items: center;
    gap: 12px;
    min-height: 160px;
    padding: 9px 15px 10px 13px;
    overflow: hidden;

    border: 2px ridge #8ca0d9;

    background:
        repeating-linear-gradient(
            to bottom,
            transparent 0 2px,
            rgba(255,255,255,.035) 2px 3px
        ),
        linear-gradient(
            105deg,
            #030a54,
            #102a9a 46%,
            #0b1d7d 74%,
            #091459
        );

    box-shadow:
        inset 0 2px 3px #ffffff55,
        inset 0 -6px 8px #0003;
}

.banner::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;

    background: radial-gradient(
        ellipse at 25% 20%,
        #6d95f46e,
        transparent 44%
    );

    pointer-events: none;
}

/* SILHUETA URBANA */

.silhueta {
    position: absolute;
    z-index: -1;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 66px;
    opacity: .64;
    fill: #061052;
    pointer-events: none;
}

/* TELEVISÃO ANTIGA */

.tv-antiga {
    width: 132px;
    max-width: 100%;
    height: auto;
    align-self: end;
    filter: drop-shadow(8px 7px 5px #0009);
}

/* LOGOTIPO */

.marca {
    position: relative;
    min-width: 0;
    padding: 5px 0;
}

.marca::before,
.marca::after {
    content: "";
    position: absolute;
    z-index: -1;
    pointer-events: none;
    border-radius: 50%;
    transform: rotate(-8deg);
}

.marca::before {
    width: min(70%, 420px);
    height: 48px;
    top: -8px;
    left: 29%;
    border-top: 8px solid #f42533;
}

.marca::after {
    width: min(57%, 350px);
    height: 43px;
    left: 4%;
    bottom: 7px;
    border-bottom: 7px solid #ed1e2d;
}

.logotipo {
    display: block;
    margin: 0;

    font-family: Impact, "Arial Black", Arial, sans-serif;
    font-style: italic;
    font-weight: 900;
    font-size: clamp(45px, 5vw, 79px);

    line-height: 1.05;
    letter-spacing: -1.7px;
    text-transform: uppercase;
    white-space: nowrap;

    transform: skew(-6deg);

    color: #f4f7ff;

    background: linear-gradient(
        180deg,
        #ffffff 1%,
        #edf3ff 33%,
        #a6b8e0 58%,
        #f6f8ff 78%,
        #a1a9bd 100%
    );

    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;

    -webkit-text-stroke: 1px #061450b3;

    filter:
        drop-shadow(2px 3px 0 #020b44)
        drop-shadow(3px 4px 1px #0008);
}

.slogan {
    margin: 3px 0 0 19px;
    color: #f7f9ff;
    font-size: clamp(14px, 1.45vw, 22px);
    font-style: italic;
    font-weight: bold;
    line-height: 1.3;
    text-shadow: 2px 2px 2px #00083c;
    white-space: nowrap;
}

/* ANTENA */

.parabolica {
    width: 113px;
    height: auto;
    opacity: .9;
    filter: drop-shadow(3px 5px 2px #0006);
}

/* PESQUISA */

.pesquisa {
    position: relative;
    z-index: 1;
    width: 100%;
    color: white;
}

.pesquisa label {
    display: block;
    margin-bottom: 6px;
    font-size: 15px;
    font-weight: bold;
    text-shadow: 1px 1px 1px #000a42;
}

.pesquisa-linha {
    display: flex;
    gap: 7px;
}

.pesquisa input {
    width: 100%;
    min-width: 0;
    height: 29px;
    padding: 3px 7px;
    border: 2px inset #b5bdcf;
    border-radius: 0;
    background: white;
    color: #152044;
    font: inherit;
    box-shadow: inset 1px 1px 1px #777;
}

.pesquisa button {
    min-width: 47px;
    height: 29px;
    padding: 1px 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    color: #0e1731;
    border: 2px outset #f8faff;

    background: linear-gradient(
        #fcfcfd,
        #d2d6e1 67%,
        #b8bfcd
    );

    box-shadow: 1px 1px 0 #596077;
}

.pesquisa button:hover {
    background: #e2eaff;
}

.pesquisa button:active {
    border-style: inset;
}

/* NAVEGAÇÃO */

.navegacao {
    display: grid;

    grid-template-columns:
        .85fr 1.05fr .9fr 1fr 1.35fr .8fr;

    gap: 5px;
    padding: 6px 10px;

    border: 1px solid #8a91a0;
    border-top-color: #eef0f5;

    background: linear-gradient(
        #e9eaf0,
        #c2c7d1 90%,
        #a5aaba
    );

    box-shadow:
        inset 0 1px white,
        0 2px 3px #cbd0da;
}

.link-menu {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-width: 0;
    min-height: 40px;
    padding: 6px 8px;
    text-decoration: none;

    font-size: clamp(13px, 1.2vw, 18px);
    font-weight: bold;
    white-space: nowrap;
    color: #0e1731;

    border: 2px outset #f8faff;

    background: linear-gradient(
        #fcfcfd,
        #d2d6e1 67%,
        #b8bfcd
    );

    text-shadow: 1px 1px #fff;
    box-shadow: 1px 1px 0 #596077;
}

.link-menu:hover:not(.ativo) {
    background: linear-gradient(
        #fff,
        #dce4ff 65%,
        #b3c0e9
    );
}

.link-menu:active {
    border-style: inset;
}

.link-menu.ativo {
    border: 2px inset #849bd6;

    background: linear-gradient(
        #284cc4,
        #071c91 65%,
        #03075f
    );

    color: white;
    text-shadow: 1px 1px #02083d;
}

.icone {
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
    stroke: #07185d;
    stroke-width: 1.6;
    fill: #f7f8ff;
}

a:focus-visible,
button:focus-visible,
input:focus-visible {
    outline: 3px solid #f7c442;
    outline-offset: 2px;
}

/* CONTEÚDO */

.area-principal {
    min-height: calc(100vh - 227px);
    padding: 18px;

    background: linear-gradient(
        #f7f9ff,
        #f9faff
    );
}

.painel {
    max-width: 1100px;
    margin: 0 auto;
    background: white;
    border: 1px solid #8999bd;
    box-shadow: 2px 2px 0 #d1d7e4;
}

.painel-titulo {
    margin: 0;
    padding: 10px 14px;
    color: white;
    font-size: 16px;

    background: linear-gradient(
        #385bc2,
        #081878
    );
}

.painel-conteudo {
    padding: 15px;
}

.contador {
    color: #516078;
    font-size: 13px;
    margin: 0 0 15px;
}

.lista-resultados {
    display: grid;
    gap: 8px;
}

.resultado {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px;
    border: 1px solid #c4cfdb;
    background: #f9faff;
}

.resultado:hover {
    background: #edf2ff;
}

.miniatura {
    width: 128px;
    aspect-ratio: 4 / 3;
    object-fit: contain;
    flex-shrink: 0;
    background: #080e2d;
    border: 1px solid #8999bd;
}

.resultado-info {
    min-width: 0;
}

.resultado-titulo {
    color: #123d91;
    font-weight: bold;
    text-decoration: none;
    line-height: 1.4;
}

.resultado-titulo:hover {
    text-decoration: underline;
}

.resultado-meta {
    font-size: 12px;
    line-height: 1.6;
    color: #516078;
    margin: 5px 0;
}

.assistir {
    display: inline-block;
    margin-top: 5px;
    padding: 5px 12px;
    border: 2px outset white;

    background: linear-gradient(
        #fff,
        #c1cde5
    );

    color: #10266c;
    font-size: 12px;
    font-weight: bold;
    text-decoration: none;
}

.aviso {
    padding: 12px;
    color: #162765;
    background: #eef2ff;
    border: 1px solid #9ba9c7;
}

[hidden] {
    display: none !important;
}

/* RESPONSIVIDADE */

@media (max-width: 1130px) {

    .banner {
        grid-template-columns:
            110px minmax(315px, 1fr) 72px 248px;

        gap: 8px;
    }

    .tv-antiga {
        width: 108px;
    }

    .parabolica {
        width: 76px;
    }

    .logotipo {
        font-size: clamp(42px, 5.25vw, 66px);
    }

    .slogan {
        font-size: clamp(12px, 1.5vw, 18px);
        margin-left: 8px;
    }
}

@media (max-width: 850px) {

    .banner {
        grid-template-columns:
            100px minmax(0, 1fr) 240px;

        padding: 12px 10px;
        min-height: 136px;
    }

    .parabolica {
        display: none;
    }

    .logotipo {
        font-size: clamp(37px, 5.5vw, 55px);
    }

    .slogan {
        font-size: clamp(11px, 1.8vw, 15px);
        white-space: normal;
    }

    .navegacao {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 680px) {

    .banner {
        grid-template-columns:
            75px minmax(0, 1fr);
        gap: 5px 9px;
    }

    .tv-antiga {
        width: 75px;
        align-self: center;
    }

    .logotipo {
        font-size: clamp(30px, 8vw, 56px);
        letter-spacing: -.8px;
    }

    .slogan {
        font-size: clamp(12px, 2.9vw, 17px);
        white-space: normal;
        margin-left: 1px;
    }

    .pesquisa {
        grid-column: 1 / -1;
        margin-top: 5px;
    }

    .navegacao {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 5px;
        padding: 6px;
    }

    .link-menu {
        font-size: 14px;
        gap: 6px;
    }

    .area-principal {
        min-height: 65vh;
        padding: 8px;
    }

    .miniatura {
        width: 90px;
    }

    .resultado {
        gap: 9px;
    }
}

@media (max-width: 360px) {

    .logotipo {
        font-size: 28px;
    }

    .icone {
        width: 18px;
        height: 18px;
        flex-basis: 18px;
    }

    .link-menu {
        font-size: 12px;
    }
}

</style>

</head>

<script>

"use strict";

let catalogo = [];
let catalogoCarregado = false;
let carregamento = null;

const formulario =
    document.getElementById("form-pesquisa");

const campo =
    document.getElementById("termo-pesquisa");

const painel =
    document.getElementById("painel");

const tituloPainel =
    document.getElementById("painel-titulo");

const contador =
    document.getElementById("contador");

const resultados =
    document.getElementById("resultados");

const linksMenu =
    [...document.querySelectorAll(".link-menu")];


/* NORMALIZAÇÃO DOS TERMOS */

function normalizar(texto) {

    return String(texto ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

}


/* CARREGAMENTO DO CATÁLOGO */

async function carregarCatalogo() {

    if (catalogoCarregado) {
        return catalogo;
    }

    if (carregamento) {
        return carregamento;
    }

    carregamento = (async () => {

        const resposta = await fetch(
            "catalogo-player.json",
            { cache: "no-cache" }
        );

        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " + resposta.status
            );

        }

        const dados = await resposta.json();

        if (Array.isArray(dados)) {

            catalogo = dados;

        } else if (
            Array.isArray(dados.campos) &&
            Array.isArray(dados.registros)
        ) {

            catalogo = dados.registros.map(registro =>

                Object.fromEntries(

                    dados.campos.map(
                        (nome, i) => [nome, registro[i]]
                    )

                )

            );

        } else {

            throw new Error("Formato de catálogo inválido");

        }

        catalogo = catalogo.filter(video =>

            video.drive_id &&
            video.titulo &&
            !video.duplicata_provavel_de

        );

        catalogoCarregado = true;

        return catalogo;

    })();

    try {

        return await carregamento;

    } finally {

        carregamento = null;

    }

}


/* FORMATAÇÃO DE DATA */

function formatarData(data) {

    if (!data) {
        return "Data não identificada";
    }

    const valor = String(data);

    if (/^\d{4}-\d{2}-\d{2}$/.test(valor)) {

        const [ano, mes, dia] = valor.split("-");

        return `${dia}/${mes}/${ano}`;

    }

    if (/^\d{4}-\d{2}$/.test(valor)) {

        const [ano, mes] = valor.split("-");

        return `${mes}/${ano}`;

    }

    return valor;

}


/* MINIATURAS */

function obterMiniatura(video) {

    if (!video.youtube_url) {
        return "favicon.svg";
    }

    try {

        const url = new URL(video.youtube_url);

        let codigo = "";

        if (url.hostname === "youtu.be") {

            codigo = url.pathname.slice(1);

        } else if (

            [
                "youtube.com",
                "www.youtube.com",
                "m.youtube.com"
            ].includes(url.hostname)

        ) {

            codigo = url.searchParams.get("v") || "";

        }

        if (/^[A-Za-z0-9_-]{11}$/.test(codigo)) {

            return `https://i.ytimg.com/vi/${codigo}/hqdefault.jpg`;

        }

    } catch (erro) {

        console.warn("URL inválida:", erro);

    }

    return "favicon.svg";

}


/* DURAÇÃO */

function formatarDuracao(segundos) {

    if (!segundos || !Number.isFinite(Number(segundos))) {

        return "";

    }

    const total = Math.floor(Number(segundos));

    const horas = Math.floor(total / 3600);

    const minutos = Math.floor(total % 3600 / 60);

    const restante = total % 60;

    return [horas, minutos, restante]

        .map(numero =>

            String(numero).padStart(2, "0")

        )

        .join(":");

}


/* CARTÃO DO VÍDEO */

function criarResultado(video) {

    const item = document.createElement("article");

    item.className = "resultado";

    const endereco =

        "assistir/" +
        encodeURIComponent(video.drive_id) +
        ".html";

    const imagemLink = document.createElement("a");

    imagemLink.href = endereco;

    const imagem = document.createElement("img");

    imagem.className = "miniatura";

    imagem.src = obterMiniatura(video);

    imagem.alt = video.titulo;

    imagem.loading = "lazy";

    imagem.addEventListener("error", () => {

        if (!imagem.dataset.fallback) {

            imagem.dataset.fallback = "1";

            imagem.src = "favicon.svg";

        }

    });

    imagemLink.appendChild(imagem);

    const info = document.createElement("div");

    info.className = "resultado-info";

    const titulo = document.createElement("a");

    titulo.className = "resultado-titulo";

    titulo.href = endereco;

    titulo.textContent = video.titulo;

    const meta = document.createElement("p");

    meta.className = "resultado-meta";

    const duracao = formatarDuracao(

        video.duracao_segundos

    );

    meta.textContent = [

        video.programa,

        video.emissora,

        formatarData(video.data_exibicao),

        duracao

    ].filter(Boolean).join(" | ");

    const botao = document.createElement("a");

    botao.className = "assistir";

    botao.href = endereco;

    botao.textContent = "▶ Assistir";

    info.append(titulo, meta, botao);

    item.append(imagemLink, info);

    return item;

}


/* EXIBIR RESULTADOS */

function exibirVideos(videos, titulo) {

    painel.hidden = false;

    tituloPainel.textContent = titulo;

    resultados.replaceChildren();

    contador.textContent =

        videos.length === 1

        ? "1 vídeo encontrado"

        : `${videos.length} vídeos encontrados`;

    if (!videos.length) {

        const mensagem = document.createElement("p");

        mensagem.className = "aviso";

        mensagem.textContent =

            "Nenhum vídeo encontrado. Tente outro termo.";

        resultados.appendChild(mensagem);

        return;

    }

    videos.forEach(video => {

        resultados.appendChild(

            criarResultado(video)

        );

    });

}


/* BUSCA INTELIGENTE */

async function pesquisar(termo) {

    painel.hidden = false;

    tituloPainel.textContent = "Pesquisando no acervo...";

    contador.textContent = "Carregando catálogo";

    resultados.replaceChildren();

    try {

        await carregarCatalogo();

        const palavras = normalizar(termo)

            .split(/\s+/)

            .filter(Boolean);

        const encontrados = catalogo.filter(video => {

            const texto = normalizar([

                video.titulo,

                video.programa,

                video.emissora,

                video.apresentadores,

                video.apresentador,

                video.reporter,

                video.reporteres,

                video.local_reportagem,

                video.data_exibicao,

                formatarData(video.data_exibicao),

                video.materias_identificadas,

                video.canal_origem,

                video.descricao,

                video.palavras_chave

            ].flat(Infinity).filter(Boolean).join(" "));

            return palavras.every(

                palavra => texto.includes(palavra)

            );

        });

        exibirVideos(

            encontrados,

            `Resultados para: ${termo}`

        );

    } catch (erro) {

        mostrarErro(erro);

    }

}


/* TRATAMENTO DE ERROS */

function mostrarErro(erro) {

    console.error(erro);

    painel.hidden = false;

    tituloPainel.textContent = "Acervo indisponível";

    contador.textContent =

        "Não foi possível carregar o catálogo.";

    resultados.replaceChildren();

    const link = document.createElement("a");

    link.href = "acervo.html";

    link.textContent = "Acessar o acervo diretamente";

    resultados.appendChild(link);

}


/* FILTROS POR CATEGORIA */

async function exibirCategorias(campo, titulo) {

    painel.hidden = false;

    tituloPainel.textContent = titulo;

    contador.textContent = "Carregando catálogo...";

    resultados.replaceChildren();

    try {

        await carregarCatalogo();

        const grupos = new Map();

        catalogo.forEach(video => {

            let categoria = video[campo];

            if (campo === "data_exibicao") {

                categoria = String(categoria || "")

                    .match(/^\d{4}/)?.[0];

            }

            if (!categoria) {

                categoria = "Não identificado";

            }

            if (!grupos.has(categoria)) {

                grupos.set(categoria, []);

            }

            grupos.get(categoria).push(video);

        });

        contador.textContent =

            `${catalogo.length} vídeos catalogados`;

        const categorias = [...grupos.keys()]

            .sort((a, b) => a.localeCompare(b, "pt-BR"));

        categorias.forEach(categoria => {

            const item = document.createElement("article");

            item.className = "resultado";

            const botao = document.createElement("button");

            botao.className = "assistir";

            botao.style.cursor = "pointer";

            const videos = grupos.get(categoria);

            botao.textContent =

                `${categoria} (${videos.length} vídeos)`;

            botao.addEventListener("click", () => {

                exibirVideos(videos, categoria);

            });

            item.appendChild(botao);

            resultados.appendChild(item);

        });

    } catch (erro) {

        mostrarErro(erro);

    }

}


/* SOBRE O PROJETO */

function exibirSobre() {

    painel.hidden = false;

    tituloPainel.textContent = "Sobre o Newstalgia";

    contador.textContent = "";

    resultados.replaceChildren();

    const paragrafo = document.createElement("p");

    paragrafo.textContent =

        "O Newstalgia é um acervo digital dedicado à " +

        "preservação da memória do jornalismo televisivo " +

        "brasileiro, reunindo reportagens e edições " +

        "históricas das décadas de 1990 e 2000.";

    const programas = document.createElement("p");

    programas.textContent =

        "Programas iniciais: Cidade Alerta, Brasil Urgente " +

        "e Repórter Cidadão.";

    const slogan = document.createElement("strong");

    slogan.textContent =

        "As notícias passam. A história permanece.";

    resultados.append(paragrafo, programas, slogan);

}


/* CONTROLE DO MENU */

function atualizarMenu(hash) {

    linksMenu.forEach(link => {

        const ativo = hash

            ? link.getAttribute("href") === hash

            : link.getAttribute("href") === "index.html";

        link.classList.toggle("ativo", ativo);

        if (ativo) {

            link.setAttribute("aria-current", "page");

        } else {

            link.removeAttribute("aria-current");

        }

    });

}


/* NAVEGAÇÃO INTERNA */

function atualizarSecao() {

    const hash = window.location.hash;

    atualizarMenu(hash);

    switch (hash) {

        case "#programas":

            exibirCategorias("programa", "Programas");

            break;

        case "#emissoras":

            exibirCategorias("emissora", "Emissoras");

            break;

        case "#linhas-do-tempo":

            exibirCategorias(

                "data_exibicao",

                "Linhas do Tempo"

            );

            break;

        case "#sobre":

            exibirSobre();

            break;

        default:

            painel.hidden = true;

    }

}


/* EVENTO DE PESQUISA */

formulario.addEventListener("submit", evento => {

    evento.preventDefault();

    const termo = campo.value.trim();

    if (!termo) {

        campo.focus();

        return;

    }

    history.replaceState(

        null,

        "",

        "?q=" + encodeURIComponent(termo)

    );

    atualizarMenu("");

    pesquisar(termo);

});


/* INICIALIZAÇÃO */

window.addEventListener("hashchange", atualizarSecao);

const pesquisaInicial = new URLSearchParams(

    window.location.search

).get("q");

if (window.location.hash) {

    atualizarSecao();

} else if (pesquisaInicial) {

    campo.value = pesquisaInicial;

    pesquisar(pesquisaInicial);

} else {

    atualizarSecao();

}

</script>
